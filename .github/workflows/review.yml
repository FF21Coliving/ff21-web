# The review agent: Claude reads every pull request, comments on what it
# finds, and gives a verdict. A blocking verdict fails this check, and main's
# branch protection won't merge a pull request until it passes. Madhvik
# merges; nobody else approves.
#
# Needs the repository secret ANTHROPIC_API_KEY (Settings → Secrets and
# variables → Actions), and the same secret under Dependabot secrets for its
# update PRs. Pull requests from forks get no secrets, so they
# can't pass this check.
name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You review pull requests for ff21.in, FF21 Coliving's live website.
            Every merge to main deploys to production at once, so your job is
            to stop anything that could break the site, lose leads or search
            traffic, or say something untrue. Read CONTRIBUTING.md first.

            Look at the diff (gh pr diff) and the code around it. Check:
            1. Bugs: anything that could crash a page, break the Find my home
               form, the lead API (src/app/api/lead*, src/lib/lead*, zoho*),
               or tracking (src/components/analytics.tsx, src/lib/track.ts).
            2. Search: removed or renamed pages without a redirect in
               next.config.ts; lines deleted from tests/fixtures/legacy-urls.txt;
               changes to robots, sitemap, canonical URLs, titles of pages that
               already rank.
            3. Facts: prices, meals, policies and numbers in src/lib/site.ts,
               properties.ts and content.ts must agree everywhere they appear.
            4. Security and privacy: keys, tokens or personal data in the code
               (the repository is public); unsafe HTML; new third-party scripts.
            5. Speed: new heavy images, scripts or client components on the
               homepage, home pages and area pages.
            6. Tests: changed behaviour should come with changed tests.

            Put specific problems as inline comments on the lines concerned
            (mcp__github_inline_comment__create_inline_comment). Then post one
            summary comment with gh pr comment, in plain words, starting with
            "Review: ✅ Good to merge" or "Review: ❌ Needs changes", and list
            what you checked.

            Only block for real problems: a bug, a broken URL or redirect, a
            wrong fact, a leaked secret, a security hole, or a clear speed
            regression. Style preferences are comments, not blockers.

            Finally write exactly one word, PASS or BLOCK, to the file
            review-verdict.txt in the working directory.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep,Write"
      - name: Verdict
        run: |
          verdict=$(tr -d '[:space:]' < review-verdict.txt 2>/dev/null || true)
          echo "Review verdict: ${verdict:-none}"
          test "$verdict" = PASS
